name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Run Pint linter
        run: composer lint

      - name: Run tests
        run: composer test

      - name: Smoke test (live HTTP check)
        run: |
          php artisan serve --port=8000 --no-interaction &
          SERVER_PID=$!
          sleep 2
          curl --fail --silent --output /dev/null http://localhost:8000/up
          curl --fail --silent --output /dev/null http://localhost:8000/
          kill $SERVER_PID
